<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>うさぎとねこの積み木タワーDX</title>
<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
touch-action:none;
font-family:sans-serif;
background:#87ceeb;
}
.screen{
display:none;
width:100%;
height:100%;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:16px;
}
.screen.active{
display:flex;
}
h1{
margin:10px 0;
}
button{
border:none;
border-radius:14px;
padding:16px 28px;
font-size:20px;
font-weight:bold;
background:#ffb347;
min-width:200px;
}
#gameScreen{
background:linear-gradient(#87ceeb,#e8fbff);
}
#hud{
width:100%;
display:flex;
justify-content:space-between;
padding:10px;
font-size:20px;
font-weight:bold;
}
#gameArea{
position:relative;
width:100%;
max-width:420px;
height:calc(100vh - 90px);
background:#fafafa;
border:3px solid #444;
border-radius:12px;
overflow:hidden;
}
#tower{
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%);
width:180px;
}
.block{
height:30px;
margin-top:2px;
border-radius:6px;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
border:2px solid rgba(0,0,0,.15);
}
#mover{
position:absolute;
top:20px;
left:0;
height:30px;
border-radius:6px;
display:flex;
align-items:center;
justify-content:center;
font-size:20px;
}
#guide{
position:absolute;
bottom:8px;
width:100%;
font-size:15px;
font-weight:bold;
color:#333;
}
#bossArea{
position:absolute;
top:80px;
left:50%;
transform:translateX(-50%);
display:none;
flex-direction:column;
align-items:center;
z-index:10;
}
#boss{
font-size:72px;
}
#bossBarWrap{
width:180px;
height:16px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-top:6px;
}
#bossBar{
height:100%;
width:100%;
background:#ff4d4d;
}
.rank{
font-size:34px;
font-weight:bold;
margin:12px;
}
</style>
</head>
<body>

<div id="startScreen" class="screen active">
<h1>🐰🐱 積み木タワーDX</h1>
<p>
左右に動く積み木をタイミングよく積もう！<br>
高く積むほど高得点！<br>
さらに巨大うさぎタワーにも挑戦できるよ！
</p>
<button id="startBtn">スタート</button>
</div>

<div id="gameScreen" class="screen">
<div id="hud">
<div>スコア: <span id="score">0</span></div>
<div>残り: <span id="time">60</span>秒</div>
</div>

<div id="gameArea">

<div id="bossArea">
<div id="boss">🐰👑</div>
<div id="bossBarWrap">
<div id="bossBar"></div>
</div>
</div>

<div id="mover">🐰</div>
<div id="tower"></div>

<div id="guide">
タップ・クリックで積む
</div>

</div>
</div>

<div id="resultScreen" class="screen">
<h1>結果発表</h1>
<div>最終スコア</div>
<h2 id="finalScore">0</h2>
<div class="rank" id="rank">C</div>
<button id="retryBtn">もう一度遊ぶ</button>
</div>

<script>
const startScreen=document.getElementById("startScreen");
const gameScreen=document.getElementById("gameScreen");
const resultScreen=document.getElementById("resultScreen");

const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const finalScoreEl=document.getElementById("finalScore");
const rankEl=document.getElementById("rank");

const mover=document.getElementById("mover");
const tower=document.getElementById("tower");
const gameArea=document.getElementById("gameArea");

const bossArea=document.getElementById("bossArea");
const bossBar=document.getElementById("bossBar");

let score=0;
let time=60;
let timer;
let animation;
let dir=1;
let pos=0;
let speed=3;

let currentWidth=120;
let towerWidth=120;
let blockCount=0;

let bossMode=false;
let bossHP=100;

function showScreen(screen){
[startScreen,gameScreen,resultScreen].forEach(s=>{
s.classList.remove("active");
});
screen.classList.add("active");
}

function startGame(){

clearInterval(timer);
cancelAnimationFrame(animation);

score=0;
time=60;
dir=1;
speed=3;
pos=0;
blockCount=0;

tower.innerHTML="";
scoreEl.textContent="0";
timeEl.textContent="60";

currentWidth=120;
towerWidth=120;

bossMode=false;
bossHP=100;
bossArea.style.display="none";
bossBar.style.width="100%";

showScreen(gameScreen);

createMover();
animate();

timer=setInterval(()=>{
time--;
timeEl.textContent=time;

if(time===30 && !bossMode){
startBossBattle();
}

if(time<=0){
endGame();
}
},1000);
}

function createMover(){
mover.textContent=(blockCount%2===0)?"🐰":"🐱";
mover.style.width=currentWidth+"px";
}

function animate(){

cancelAnimationFrame(animation);

function loop(){

const max=gameArea.clientWidth-currentWidth;

pos+=speed*dir;

if(pos<=0){
pos=0;
dir=1;
}
if(pos>=max){
pos=max;
dir=-1;
}

mover.style.left=pos+"px";

animation=requestAnimationFrame(loop);
}

loop();
}

function startBossBattle(){
bossMode=true;
bossHP=100;
bossArea.style.display="flex";
}

function placeBlock(){

if(time<=0)return;

const center=gameArea.clientWidth/2;
const moverCenter=pos+currentWidth/2;
const diff=Math.abs(center-moverCenter);

let points=10;

if(diff<10){
points=30;
}else if(diff<25){
points=20;
}

score+=points;

const shrink=Math.min(diff/6,25);

towerWidth=Math.max(60,currentWidth-shrink);

const block=document.createElement("div");
block.className="block";
block.style.width=towerWidth+"px";
block.style.background=(blockCount%2===0)?"#ffd6e7":"#dfffcf";
block.textContent=(blockCount%2===0)?"🐰":"🐱";

tower.prepend(block);

currentWidth=towerWidth;
blockCount++;

if(blockCount%5===0){
speed+=0.4;
}

if(bossMode){

let damage=0;

if(diff<10){
damage=12;
}else if(diff<25){
damage=8;
}else{
damage=4;
}

bossHP-=damage;

if(bossHP<0){
bossHP=0;
}

bossBar.style.width=bossHP+"%";

if(bossHP===0){

score+=300;
scoreEl.textContent=score;

bossArea.style.display="none";
bossMode=false;

const notice=document.createElement("div");
notice.textContent="🎉 巨大うさぎ撃破！ +300点";
notice.style.position="absolute";
notice.style.top="140px";
notice.style.left="50%";
notice.style.transform="translateX(-50%)";
notice.style.background="#fff8a8";
notice.style.padding="10px";
notice.style.borderRadius="10px";
notice.style.fontWeight="bold";
gameArea.appendChild(notice);

setTimeout(()=>{
notice.remove();
},2000);
}
}

scoreEl.textContent=score;
createMover();
}

function endGame(){

clearInterval(timer);
cancelAnimationFrame(animation);

finalScoreEl.textContent=score;

let rank="C";

if(score>=1200){
rank="S";
}else if(score>=800){
rank="A";
}else if(score>=500){
rank="B";
}

rankEl.textContent=rank;

showScreen(resultScreen);
}

document.getElementById("startBtn").addEventListener("click",startGame);
document.getElementById("retryBtn").addEventListener("click",startGame);

gameArea.addEventListener("pointerdown",placeBlock);
</script>

</body>
</html>
